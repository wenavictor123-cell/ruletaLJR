<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Ruleta — Aplausos, Dinámicas y Juegos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3EEE0;
    --surface:#FFFFFF;
    --ink:#1B1B22;
    --ink-soft:#5B5749;
    --line:#E4DCC8;
    --accent-aplausos:#C97A12;
    --accent-dinamicas:#137F74;
    --accent-juegos:#B93357;
    --accent-aplausos-soft:#F3DBA9;
    --accent-dinamicas-soft:#BFE6E1;
    --accent-juegos-soft:#F3C3D0;
    --focus:#2F6FED;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14171F; --surface:#1E2230; --ink:#F2F0EA; --ink-soft:#B9B6AC;
      --line:#2C3040;
      --accent-aplausos:#FFC15E; --accent-dinamicas:#4FD1C5; --accent-juegos:#FF6B81;
      --accent-aplausos-soft:#4A3A1E; --accent-dinamicas-soft:#1C3E3B; --accent-juegos-soft:#4A2530;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14171F; --surface:#1E2230; --ink:#F2F0EA; --ink-soft:#B9B6AC;
    --line:#2C3040;
    --accent-aplausos:#FFC15E; --accent-dinamicas:#4FD1C5; --accent-juegos:#FF6B81;
    --accent-aplausos-soft:#4A3A1E; --accent-dinamicas-soft:#1C3E3B; --accent-juegos-soft:#4A2530;
  }

  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:'Work Sans', system-ui, -apple-system, sans-serif;
    line-height:1.5;
    min-height:100vh;
  }
  h1,h2,h3,.display{
    font-family:'Fredoka', system-ui, sans-serif;
    font-weight:600;
    margin:0;
  }
  button{font-family:inherit;}
  :focus-visible{outline:3px solid var(--focus); outline-offset:2px;}

  header{
    display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between;
    gap:16px; padding:20px clamp(16px,4vw,40px);
    border-bottom:1px solid var(--line);
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand-dot{width:14px;height:14px;border-radius:50%;
    background:conic-gradient(var(--accent-aplausos) 0 33%, var(--accent-dinamicas) 33% 66%, var(--accent-juegos) 66% 100%);}
  .brand h1{font-size:1.3rem;}
  nav{display:flex; gap:8px; flex-wrap:wrap;}
  .tab-btn{
    border:1px solid var(--line); background:var(--surface); color:var(--ink);
    padding:9px 18px; border-radius:999px; font-size:0.95rem; cursor:pointer;
    font-weight:500;
  }
  .tab-btn.active{background:var(--ink); color:var(--bg); border-color:var(--ink);}

  main{max-width:980px; margin:0 auto; padding:clamp(20px,4vw,44px);}
  .view{display:none;}
  .view.active{display:block;}

  /* ---- category pills ---- */
  .cat-row{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:28px;}
  .cat-pill{
    border:2px solid transparent; border-radius:999px; padding:10px 20px;
    font-weight:600; cursor:pointer; font-size:0.95rem; background:var(--surface);
    color:var(--ink-soft);
  }
  .cat-pill[data-cat="aplausos"]{border-color:var(--accent-aplausos);}
  .cat-pill[data-cat="dinamicas"]{border-color:var(--accent-dinamicas);}
  .cat-pill[data-cat="juegos"]{border-color:var(--accent-juegos);}
  .cat-pill.active[data-cat="aplausos"]{background:var(--accent-aplausos); color:#22160a;}
  .cat-pill.active[data-cat="dinamicas"]{background:var(--accent-dinamicas); color:#062522;}
  .cat-pill.active[data-cat="juegos"]{background:var(--accent-juegos); color:#2a0512;}

  /* ---- wheel ---- */
  .wheel-zone{display:flex; flex-direction:column; align-items:center; gap:18px;}
  .wheel-wrap{position:relative; width:min(90vw,380px); height:min(90vw,380px);}
  .wheel-pointer{
    position:absolute; top:-14px; left:50%; transform:translateX(-50%);
    width:0; height:0; border-left:16px solid transparent; border-right:16px solid transparent;
    border-top:26px solid var(--ink); z-index:3; filter:drop-shadow(0 2px 1px rgba(0,0,0,.25));
  }
  #wheelCanvas{
    width:100%; height:100%; border-radius:50%;
    box-shadow:0 8px 0 rgba(0,0,0,.15), 0 0 0 8px var(--surface), 0 0 0 9px var(--line);
    transition:transform 4.2s cubic-bezier(.15,.85,.2,1);
  }
  .wheel-status{color:var(--ink-soft); font-size:0.9rem; text-align:center;}
  .wheel-status button{background:none;border:none;text-decoration:underline;color:var(--ink-soft);cursor:pointer;font-size:0.9rem;padding:0;}
  .spin-btn{
    font-family:'Fredoka',sans-serif; font-size:1.15rem; font-weight:600;
    padding:14px 40px; border-radius:999px; border:none; cursor:pointer;
    color:#fff; box-shadow:0 4px 0 rgba(0,0,0,.2);
  }
  .spin-btn:active{transform:translateY(2px); box-shadow:0 2px 0 rgba(0,0,0,.2);}
  .spin-btn.aplausos{background:var(--accent-aplausos);}
  .spin-btn.dinamicas{background:var(--accent-dinamicas);}
  .spin-btn.juegos{background:var(--accent-juegos);}
  .spin-btn:disabled{opacity:0.55; cursor:default;}
  .empty-note{
    text-align:center; color:var(--ink-soft); border:1px dashed var(--line);
    border-radius:14px; padding:28px; margin-top:10px;
  }

  /* ---- manual ---- */
  .manual-controls{display:flex; gap:10px; flex-wrap:wrap; margin-bottom:22px; align-items:center;}
  .search-input{
    flex:1; min-width:180px; padding:11px 16px; border-radius:12px;
    border:1px solid var(--line); background:var(--surface); color:var(--ink); font-size:0.95rem;
  }
  .grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:16px;}
  .ticket{
    background:var(--surface); border-radius:14px; border:1px solid var(--line);
    padding:16px; cursor:pointer; position:relative; text-align:left;
  }
  .ticket-strip{height:6px; border-radius:6px; margin-bottom:12px;}
  .ticket-strip.aplausos{background:var(--accent-aplausos);}
  .ticket-strip.dinamicas{background:var(--accent-dinamicas);}
  .ticket-strip.juegos{background:var(--accent-juegos);}
  .ticket h3{font-size:1.05rem; margin-bottom:6px;}
  .ticket p{font-size:0.88rem; color:var(--ink-soft); margin:0;
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
  .badge{
    display:inline-block; font-size:0.75rem; padding:3px 10px; border-radius:999px;
    margin-top:10px; font-weight:600;
  }
  .badge.aplausos{background:var(--accent-aplausos-soft); color:var(--accent-aplausos);}
  .badge.dinamicas{background:var(--accent-dinamicas-soft); color:var(--accent-dinamicas);}
  .badge.juegos{background:var(--accent-juegos-soft); color:var(--accent-juegos);}
  .empty-manual{color:var(--ink-soft); padding:30px 0; text-align:center;}

  /* ---- admin ---- */
  .admin-locked{border:1px dashed var(--line); border-radius:14px; padding:34px; text-align:center; color:var(--ink-soft);}
  .form-card{background:var(--surface); border:1px solid var(--line); border-radius:16px; padding:22px; margin-bottom:28px;}
  .form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
  .form-grid .full{grid-column:1/-1;}
  label{display:block; font-size:0.85rem; font-weight:600; margin-bottom:6px; color:var(--ink-soft);}
  input[type=text],input[type=file],select,textarea{
    width:100%; padding:10px 12px; border-radius:10px; border:1px solid var(--line);
    background:var(--bg); color:var(--ink); font-size:0.92rem; font-family:inherit;
  }
  textarea{min-height:90px; resize:vertical;}
  .form-actions{display:flex; gap:10px; margin-top:16px; align-items:center;}
  .btn{
    padding:10px 22px; border-radius:999px; border:none; cursor:pointer;
    font-weight:600; font-size:0.92rem;
  }
  .btn-primary{background:var(--ink); color:var(--bg);}
  .btn-ghost{background:transparent; color:var(--ink-soft); border:1px solid var(--line);}
  .save-status{font-size:0.85rem; color:var(--ink-soft);}
  .admin-table{width:100%; border-collapse:collapse; margin-top:8px;}
  .admin-table th{text-align:left; font-size:0.78rem; color:var(--ink-soft); padding:8px 10px; border-bottom:1px solid var(--line);}
  .admin-table td{padding:10px; border-bottom:1px solid var(--line); font-size:0.9rem; vertical-align:top;}
  .row-actions{display:flex; gap:6px;}
  .icon-btn{border:1px solid var(--line); background:var(--surface); border-radius:8px; padding:5px 9px; cursor:pointer; font-size:0.8rem;}
  .admin-group h3{margin:26px 0 10px; font-size:1.05rem;}

  /* ---- modal ---- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(10,10,14,.55);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal-overlay.hidden{display:none;}
  .modal-card{
    background:var(--surface); border-radius:20px; max-width:480px; width:100%;
    padding:28px; max-height:86vh; overflow-y:auto; position:relative;
  }
  .modal-close{
    position:absolute; top:16px; right:16px; border:none; background:var(--bg);
    width:32px; height:32px; border-radius:50%; cursor:pointer; font-size:1rem; color:var(--ink);
  }
  .modal-card img{width:100%; border-radius:12px; margin:14px 0;}
  .modal-meta{display:flex; gap:8px; flex-wrap:wrap; margin:14px 0;}
  .meta-chip{font-size:0.8rem; padding:5px 12px; border-radius:999px; background:var(--bg); color:var(--ink-soft); border:1px solid var(--line);}
  .modal-instr{white-space:pre-wrap; font-size:0.98rem;}
  .toast{
    position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
    background:var(--ink); color:var(--bg); padding:11px 22px; border-radius:999px;
    font-size:0.88rem; z-index:60; opacity:0; pointer-events:none; transition:opacity .3s;
  }
  .toast.show{opacity:1;}

  @media(max-width:600px){
    .form-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>

<header>
  <div class="brand">
    <div class="brand-dot"></div>
    <h1>La Ruleta</h1>
  </div>
  <nav>
    <button class="tab-btn active" data-view="ruleta">Ruleta</button>
    <button class="tab-btn" data-view="manual">Manual</button>
    <button class="tab-btn" data-view="admin" id="adminTabBtn">Admin</button>
  </nav>
</header>

<main>

  <!-- ================= RULETA ================= -->
  <section id="view-ruleta" class="view active">
    <div class="cat-row" id="ruletaCats">
      <button class="cat-pill active" data-cat="aplausos">👏 Aplausos</button>
      <button class="cat-pill" data-cat="dinamicas">🤝 Dinámicas</button>
      <button class="cat-pill" data-cat="juegos">🎲 Juegos</button>
    </div>

    <div class="wheel-zone">
      <div class="wheel-wrap">
        <div class="wheel-pointer"></div>
        <canvas id="wheelCanvas" width="600" height="600"></canvas>
      </div>
      <button class="spin-btn aplausos" id="spinBtn">Girar la ruleta</button>
      <div class="wheel-status" id="wheelStatus"></div>
      <div class="empty-note" id="emptyNote" style="display:none;">
        Todavía no hay elementos en esta categoría. Agrégalos desde la pestaña Admin.
      </div>
    </div>
  </section>

  <!-- ================= MANUAL ================= -->
  <section id="view-manual" class="view">
    <div class="manual-controls">
      <input type="text" class="search-input" id="manualSearch" placeholder="Buscar por nombre...">
      <button class="cat-pill active" data-cat="todos">Todos</button>
      <button class="cat-pill" data-cat="aplausos">👏 Aplausos</button>
      <button class="cat-pill" data-cat="dinamicas">🤝 Dinámicas</button>
      <button class="cat-pill" data-cat="juegos">🎲 Juegos</button>
    </div>
    <div class="grid" id="manualGrid"></div>
    <div class="empty-manual" id="manualEmpty" style="display:none;">No se encontró nada con esa búsqueda.</div>
  </section>

  <!-- ================= ADMIN ================= -->
  <section id="view-admin" class="view">
    <div id="adminLocked" class="admin-locked">
      <h2 style="margin-bottom:14px;">Acceso de administración</h2>
      <p style="margin-bottom:16px; color:var(--ink-soft);">Ingresa la contraseña para agregar, editar o eliminar elementos.</p>
      <div style="display:flex; gap:8px; justify-content:center; max-width:320px; margin:0 auto;">
        <input type="password" id="adminPassInput" placeholder="Contraseña" style="flex:1;">
        <button class="btn btn-primary" id="adminLoginBtn">Entrar</button>
      </div>
      <p id="adminLoginError" style="color:var(--accent-juegos); font-size:0.85rem; margin-top:10px; display:none;">Contraseña incorrecta.</p>
    </div>

    <div id="adminContent" style="display:none;">
      <div class="form-card">
        <h2 id="formTitle" style="margin-bottom:16px;">Agregar nuevo elemento</h2>
        <input type="hidden" id="editId">
        <div class="form-grid">
          <div>
            <label for="fNombre">Nombre</label>
            <input type="text" id="fNombre" placeholder="Ej. Aplauso de trueno">
          </div>
          <div>
            <label for="fCategoria">Categoría</label>
            <select id="fCategoria">
              <option value="aplausos">Aplauso</option>
              <option value="dinamicas">Dinámica</option>
              <option value="juegos">Juego</option>
            </select>
          </div>
          <div class="full">
            <label for="fInstrucciones">Instrucciones</label>
            <textarea id="fInstrucciones" placeholder="Explica paso a paso cómo se hace..."></textarea>
          </div>
          <div>
            <label for="fDuracion">Duración (opcional)</label>
            <input type="text" id="fDuracion" placeholder="Ej. 2-3 minutos">
          </div>
          <div>
            <label for="fParticipantes">Participantes (opcional)</label>
            <input type="text" id="fParticipantes" placeholder="Ej. Grupos de 4-6">
          </div>
          <div class="full">
            <label for="fImagen">Imagen de apoyo (opcional)</label>
            <input type="file" id="fImagen" accept="image/*">
            <div id="imgPreviewWrap" style="margin-top:8px; display:none;">
              <img id="imgPreview" style="max-width:160px; border-radius:10px;">
              <button class="icon-btn" id="removeImgBtn" type="button" style="margin-left:8px;">Quitar imagen</button>
            </div>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-primary" id="submitBtn">Agregar a la ruleta</button>
          <button class="btn btn-ghost" id="cancelEditBtn" style="display:none;">Cancelar edición</button>
          <span class="save-status" id="saveStatus"></span>
        </div>
      </div>

      <div id="adminLists"></div>
    </div>
  </section>

</main>

<div class="modal-overlay hidden" id="modalOverlay">
  <div class="modal-card" id="modalCard"></div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase (SDK "compat" para poder usarlo con <script> simples) -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>

<script id="app-data" type="application/json">

  "aplausos": [

    {"id":"d2","categoria":"dinamicas","nombre":"Presentación cruzada","instrucciones":"Se forman parejas que no se conocen. Conversan 2 minutos y luego cada quien presenta a su pareja frente al grupo.","duracion":"8 minutos","participantes":"Grupos pares","material":null},

  ],
  "juegos": [
    {"id":"j1","categoria":"juegos","nombre":"Stop","instrucciones":"Se elige una letra al azar. Cada quien llena categorías (nombre, fruta, país, etc.) que empiecen con esa letra. Gana quien termine primero y grite \"stop\".","duracion":"5 minutos","participantes":"Individual o en equipos","material":null},
    {"id":"j2","categoria":"juegos","nombre":"Sillas musicales","instrucciones":"Se acomodan sillas en círculo, una menos que el número de jugadores. Mientras suena música todos caminan alrededor; al detenerse la música, deben sentarse. Quien se queda sin silla sale de la ronda.","duracion":"10 minutos","participantes":"6 o más personas","material":null},
    {"id":"j3","categoria":"juegos","nombre":"Veo veo","instrucciones":"Una persona elige un objeto visible y da pistas: \"veo veo algo... de color rojo\". El resto va adivinando qué objeto es.","duracion":"5 minutos","participantes":"Cualquier tamaño de grupo","material":null}

<script>
(function(){
  "use strict";

  var CATS = ["aplausos","dinamicas","juegos"];
  var CAT_LABEL = {aplausos:"Aplauso", dinamicas:"Dinámica", juegos:"Juego"};

  // ---------- Firebase ----------
  var firebaseConfig = {
    apiKey: "AIzaSyAtf9U-N8sIYK6k4J49Pozm7l2wOvWSMdQ",
    authDomain: "ruleta-90855.firebaseapp.com",
    projectId: "ruleta-90855",
    storageBucket: "ruleta-90855.firebasestorage.app",
    messagingSenderId: "103443827352",
    appId: "1:103443827352:web:4e66c0f4d4a265b1f41eed"
  };
  firebase.initializeApp(firebaseConfig);
  var db = firebase.firestore();
  var docRef = db.collection('ruleta').doc('data');

  // Cambia esta contraseña por la que tú quieras usar para el panel Admin.
  var ADMIN_PASSWORD = "cambia-esta-clave";

  var state = JSON.parse(document.getElementById('app-data').textContent);
  var canEdit = false;
  var currentWheelCat = "aplausos";
  var currentManualCat = "todos";
  var currentAngle = 0;
  var spinning = false;
  var usedMap = {aplausos:[], dinamicas:[], juegos:[]};

  try{
    var saved = localStorage.getItem('ruleta-usadas');
    if(saved) usedMap = JSON.parse(saved);
  }catch(e){}

  function saveUsedLocal(){
    try{ localStorage.setItem('ruleta-usadas', JSON.stringify(usedMap)); }catch(e){}
  }

  // ---------- navigation ----------
  document.querySelectorAll('.tab-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active');});
      btn.classList.add('active');
      document.querySelectorAll('.view').forEach(function(v){v.classList.remove('active');});
      document.getElementById('view-'+btn.dataset.view).classList.add('active');
      if(btn.dataset.view==='manual') renderManual();
      if(btn.dataset.view==='admin') renderAdminLists();
    });
  });

  // ---------- category pills (ruleta) ----------
  document.getElementById('ruletaCats').addEventListener('click', function(e){
    var pill = e.target.closest('.cat-pill');
    if(!pill) return;
    document.querySelectorAll('#ruletaCats .cat-pill').forEach(function(p){p.classList.remove('active');});
    pill.classList.add('active');
    currentWheelCat = pill.dataset.cat;
    var spinBtn = document.getElementById('spinBtn');
    spinBtn.className = 'spin-btn ' + currentWheelCat;
    drawWheel();
  });

  // ---------- manual controls ----------
  document.querySelector('.manual-controls').addEventListener('click', function(e){
    var pill = e.target.closest('.cat-pill');
    if(!pill) return;
    document.querySelectorAll('.manual-controls .cat-pill').forEach(function(p){p.classList.remove('active');});
    pill.classList.add('active');
    currentManualCat = pill.dataset.cat;
    renderManual();
  });
  document.getElementById('manualSearch').addEventListener('input', renderManual);

  function allItems(){
    var out = [];
    CATS.forEach(function(c){ state[c].forEach(function(it){ out.push(it); }); });
    return out;
  }

  function renderManual(){
    var q = document.getElementById('manualSearch').value.trim().toLowerCase();
    var items = allItems().filter(function(it){
      var catOk = currentManualCat==='todos' || it.categoria===currentManualCat;
      var qOk = !q || it.nombre.toLowerCase().indexOf(q)>-1;
      return catOk && qOk;
    });
    var grid = document.getElementById('manualGrid');
    grid.innerHTML = '';
    document.getElementById('manualEmpty').style.display = items.length ? 'none' : 'block';
    items.forEach(function(it){
      var card = document.createElement('button');
      card.className = 'ticket';
      card.innerHTML =
        '<div class="ticket-strip '+it.categoria+'"></div>'+
        '<h3>'+escapeHtml(it.nombre)+'</h3>'+
        '<p>'+escapeHtml(it.instrucciones)+'</p>'+
        '<span class="badge '+it.categoria+'">'+CAT_LABEL[it.categoria]+'</span>';
      card.addEventListener('click', function(){ openDetail(it); });
      grid.appendChild(card);
    });
  }

  function escapeHtml(s){
    var d = document.createElement('div');
    d.textContent = s || '';
    return d.innerHTML;
  }

  // ---------- modal ----------
  var overlay = document.getElementById('modalOverlay');
  function openDetail(it, isResult){
    var chips = '';
    if(it.duracion) chips += '<span class="meta-chip">⏱ '+escapeHtml(it.duracion)+'</span>';
    if(it.participantes) chips += '<span class="meta-chip">👥 '+escapeHtml(it.participantes)+'</span>';
    var img = (it.material && it.material.dataUrl) ? '<img src="'+it.material.dataUrl+'" alt="">' : '';
    document.getElementById('modalCard').innerHTML =
      '<button class="modal-close" id="modalCloseBtn">✕</button>'+
      '<span class="badge '+it.categoria+'">'+CAT_LABEL[it.categoria]+'</span>'+
      '<h2 style="margin-top:10px;">'+escapeHtml(it.nombre)+'</h2>'+
      img+
      '<div class="modal-meta">'+chips+'</div>'+
      '<div class="modal-instr">'+escapeHtml(it.instrucciones)+'</div>';
    overlay.classList.remove('hidden');
    document.getElementById('modalCloseBtn').addEventListener('click', closeModal);
  }
  function closeModal(){ overlay.classList.add('hidden'); }
  overlay.addEventListener('click', function(e){ if(e.target===overlay) closeModal(); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeModal(); });

  // ---------- wheel ----------
  var canvas = document.getElementById('wheelCanvas');
  var ctx = canvas.getContext('2d');
  var COLORS = {
    aplausos: ['#C97A12','#E0964A'],
    dinamicas: ['#137F74','#3AA69C'],
    juegos: ['#B93357','#D46080']
  };

  function getAvailable(cat){
    var all = state[cat];
    var used = usedMap[cat] || [];
    var avail = all.filter(function(it){ return used.indexOf(it.id) === -1; });
    if(avail.length===0 && all.length>0){
      usedMap[cat] = [];
      avail = all.slice();
    }
    return avail;
  }

  function drawWheel(){
    var items = getAvailable(currentWheelCat);
    var total = state[currentWheelCat].length;
    document.getElementById('emptyNote').style.display = total===0 ? 'block' : 'none';
    document.getElementById('spinBtn').disabled = total===0;
    var statusEl = document.getElementById('wheelStatus');
    if(total>0){
      statusEl.innerHTML = 'Quedan '+items.length+' de '+total+' sin repetir · '+
        '<button id="resetTandaBtn">reiniciar tanda</button>';
      var rb = document.getElementById('resetTandaBtn');
      if(rb) rb.addEventListener('click', function(){
        usedMap[currentWheelCat] = [];
        saveUsedLocal();
        drawWheel();
        toast('Tanda reiniciada');
      });
    } else {
      statusEl.innerHTML = '';
    }

    var w = canvas.width, h = canvas.height, r = w/2;
    ctx.clearRect(0,0,w,h);
    if(items.length===0) return;
    var slice = (Math.PI*2)/items.length;
    items.forEach(function(it, i){
      var start = i*slice, end = start+slice;
      var palette = COLORS[currentWheelCat];
      ctx.beginPath();
      ctx.moveTo(r,r);
      ctx.arc(r,r,r-4,start,end);
      ctx.closePath();
      ctx.fillStyle = palette[i%2];
      ctx.fill();

      ctx.save();
      ctx.translate(r,r);
      ctx.rotate(start+slice/2);
      ctx.textAlign = 'right';
      ctx.fillStyle = '#fff';
      ctx.font = '600 20px Work Sans, sans-serif';
      var label = it.nombre.length>20 ? it.nombre.slice(0,18)+'…' : it.nombre;
      ctx.fillText(label, r-24, 6);
      ctx.restore();
    });
  }

  function spin(){
    if(spinning) return;
    var items = getAvailable(currentWheelCat);
    if(items.length===0) return;
    spinning = true;
    document.getElementById('spinBtn').disabled = true;

    var winnerIndex = Math.floor(Math.random()*items.length);
    var winner = items[winnerIndex];
    var slice = 360/items.length;
    var sliceCenter = winnerIndex*slice + slice/2;
    // canvas draws clockwise starting at angle 0 = 3 o'clock; pointer is at top (12 o'clock = -90deg / 270deg)
    var targetAngle = 270 - sliceCenter;
    var spins = 5*360;
    var finalAngle = currentAngle - (currentAngle % 360) + spins + targetAngle;

    canvas.style.transform = 'rotate('+finalAngle+'deg)';
    currentAngle = finalAngle;

    setTimeout(function(){
      spinning = false;
      document.getElementById('spinBtn').disabled = false;
      usedMap[currentWheelCat].push(winner.id);
      saveUsedLocal();
      drawWheel();
      openDetail(winner, true);
    }, 4300);
  }
  document.getElementById('spinBtn').addEventListener('click', spin);

  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  // ---------- admin: form state ----------
  var pendingImage = null;

  function resizeImage(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxW = 480;
        var scale = Math.min(1, maxW/img.width);
        var cw = Math.round(img.width*scale), ch = Math.round(img.height*scale);
        var c = document.createElement('canvas');
        c.width = cw; c.height = ch;
        c.getContext('2d').drawImage(img,0,0,cw,ch);
        cb(c.toDataURL('image/jpeg', 0.7));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  document.getElementById('fImagen').addEventListener('change', function(e){
    var file = e.target.files[0];
    if(!file) return;
    resizeImage(file, function(dataUrl){
      pendingImage = dataUrl;
      document.getElementById('imgPreview').src = dataUrl;
      document.getElementById('imgPreviewWrap').style.display = 'block';
    });
  });
  document.getElementById('removeImgBtn').addEventListener('click', function(){
    pendingImage = null;
    document.getElementById('fImagen').value = '';
    document.getElementById('imgPreviewWrap').style.display = 'none';
  });

  function clearForm(){
    document.getElementById('editId').value = '';
    document.getElementById('fNombre').value = '';
    document.getElementById('fCategoria').value = 'aplausos';
    document.getElementById('fInstrucciones').value = '';
    document.getElementById('fDuracion').value = '';
    document.getElementById('fParticipantes').value = '';
    document.getElementById('fImagen').value = '';
    pendingImage = null;
    document.getElementById('imgPreviewWrap').style.display = 'none';
    document.getElementById('formTitle').textContent = 'Agregar nuevo elemento';
    document.getElementById('submitBtn').textContent = 'Agregar a la ruleta';
    document.getElementById('cancelEditBtn').style.display = 'none';
  }

  document.getElementById('cancelEditBtn').addEventListener('click', clearForm);

  document.getElementById('submitBtn').addEventListener('click', function(){
    var nombre = document.getElementById('fNombre').value.trim();
    var categoria = document.getElementById('fCategoria').value;
    var instrucciones = document.getElementById('fInstrucciones').value.trim();
    var duracion = document.getElementById('fDuracion').value.trim();
    var participantes = document.getElementById('fParticipantes').value.trim();
    var editId = document.getElementById('editId').value;

    if(!nombre || !instrucciones){
      toast('Completa al menos el nombre y las instrucciones');
      return;
    }

    if(editId){
      CATS.forEach(function(c){
        state[c] = state[c].filter(function(it){ return it.id !== editId; });
      });
      var item = {
        id: editId, categoria: categoria, nombre: nombre, instrucciones: instrucciones,
        duracion: duracion, participantes: participantes,
        material: pendingImage ? {tipo:'imagen', dataUrl:pendingImage} : null
      };
      state[categoria].push(item);
      toast('Elemento actualizado');
    } else {
      var id = Date.now().toString(36)+Math.random().toString(36).slice(2,7);
      var newItem = {
        id: id, categoria: categoria, nombre: nombre, instrucciones: instrucciones,
        duracion: duracion, participantes: participantes,
        material: pendingImage ? {tipo:'imagen', dataUrl:pendingImage} : null
      };
      state[categoria].push(newItem);
      toast('Elemento agregado');
    }
    clearForm();
    renderAdminLists();
    drawWheel();
    persist();
  });

  function renderAdminLists(){
    var wrap = document.getElementById('adminLists');
    wrap.innerHTML = '';
    CATS.forEach(function(cat){
      var group = document.createElement('div');
      group.className = 'admin-group';
      var rows = state[cat].map(function(it){
        return '<tr data-id="'+it.id+'">'+
          '<td>'+escapeHtml(it.nombre)+'</td>'+
          '<td>'+escapeHtml((it.instrucciones||'').slice(0,60))+'…</td>'+
          '<td class="row-actions">'+
            '<button class="icon-btn edit-btn">Editar</button>'+
            '<button class="icon-btn del-btn">Eliminar</button>'+
          '</td></tr>';
      }).join('');
      group.innerHTML = '<h3>'+CAT_LABEL[cat]+'s ('+state[cat].length+')</h3>'+
        (state[cat].length ?
          '<table class="admin-table"><thead><tr><th>Nombre</th><th>Instrucciones</th><th></th></tr></thead><tbody>'+rows+'</tbody></table>'
          : '<p style="color:var(--ink-soft);">Todavía no hay elementos.</p>');
      wrap.appendChild(group);
    });

    wrap.querySelectorAll('.edit-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.closest('tr').dataset.id;
        var it = allItems().find(function(x){ return x.id===id; });
        if(!it) return;
        document.getElementById('editId').value = it.id;
        document.getElementById('fNombre').value = it.nombre;
        document.getElementById('fCategoria').value = it.categoria;
        document.getElementById('fInstrucciones').value = it.instrucciones;
        document.getElementById('fDuracion').value = it.duracion || '';
        document.getElementById('fParticipantes').value = it.participantes || '';
        if(it.material && it.material.dataUrl){
          pendingImage = it.material.dataUrl;
          document.getElementById('imgPreview').src = pendingImage;
          document.getElementById('imgPreviewWrap').style.display = 'block';
        } else {
          pendingImage = null;
          document.getElementById('imgPreviewWrap').style.display = 'none';
        }
        document.getElementById('formTitle').textContent = 'Editar elemento';
        document.getElementById('submitBtn').textContent = 'Guardar cambios';
        document.getElementById('cancelEditBtn').style.display = 'inline-block';
        window.scrollTo({top:0, behavior:'smooth'});
      });
    });
    wrap.querySelectorAll('.del-btn').forEach(function(btn){
      btn.addEventListener('click', function(){
        var id = btn.closest('tr').dataset.id;
        if(!confirm('¿Eliminar este elemento? Esta acción no se puede deshacer.')) return;
        CATS.forEach(function(c){
          state[c] = state[c].filter(function(it){ return it.id !== id; });
        });
        renderAdminLists();
        drawWheel();
        persist();
        toast('Elemento eliminado');
      });
    });
  }

  // ---------- guardar cambios en Firestore (se sincroniza en todas las compus) ----------
  async function persist(){
    var statusEl = document.getElementById('saveStatus');
    statusEl.textContent = 'Guardando...';
    try{
      await docRef.set(state);
      statusEl.textContent = 'Guardado ✓ — ya se sincronizó en todos los dispositivos.';
    }catch(err){
      statusEl.textContent = 'No se pudo guardar. Revisa tu conexión e intenta de nuevo.';
    }
  }

  // ---------- cargar datos en vivo desde Firestore ----------
  function listenToData(){
    docRef.onSnapshot(function(snap){
      if(snap.exists){
        state = snap.data();
      } else {
        // primera vez: sube los datos de ejemplo que trae la página
        docRef.set(state);
      }
      drawWheel();
      renderManual();
      if(canEdit) renderAdminLists();
    }, function(err){
      document.getElementById('wheelStatus').textContent = 'No se pudo conectar con la base de datos.';
    });
  }

  // ---------- acceso admin por contraseña ----------
  function updateAdminView(){
    document.getElementById('adminLocked').style.display = canEdit ? 'none' : 'block';
    document.getElementById('adminContent').style.display = canEdit ? 'block' : 'none';
    if(canEdit) renderAdminLists();
  }
  document.getElementById('adminLoginBtn').addEventListener('click', function(){
    var val = document.getElementById('adminPassInput').value;
    if(val === ADMIN_PASSWORD){
      canEdit = true;
      try{ sessionStorage.setItem('ruletaAdmin','1'); }catch(e){}
      document.getElementById('adminLoginError').style.display = 'none';
      updateAdminView();
    } else {
      document.getElementById('adminLoginError').style.display = 'block';
    }
  });
  document.getElementById('adminPassInput').addEventListener('keydown', function(e){
    if(e.key === 'Enter') document.getElementById('adminLoginBtn').click();
  });
  try{
    if(sessionStorage.getItem('ruletaAdmin') === '1') canEdit = true;
  }catch(e){}

  // ---------- init ----------
  drawWheel();
  renderManual();
  updateAdminView();
  listenToData();
})();
</script>
</body>
